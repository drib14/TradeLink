title = "TradeLink Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Placeholder environment examples and the scanner's own detection patterns"
paths = [
  '''^\.env\.example$''',
  '''^server/\.env\.example$''',
  '''^client/\.env\.example$''',
  '''^admin/\.env\.example$''',
  '''^mobile/user/\.env\.example$''',
  '''^scripts/check-secrets\.js$'''
]

regexes = [
  '''your_groq_api_key_here''',
  '''insert_strong_random_secret_here''',
  '''replace_with_a_unique_random_password_at_least_16_chars'''
]
