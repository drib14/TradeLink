title = "TradeLink Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for example configs and tests"
paths = [
  '''^\.env\.example$''',
  '''^server/\.env\.example$''',
  '''^client/\.env\.example$''',
  '''^admin/\.env\.example$''',
  '''^scripts/check-secrets\.js$'''
]

regexes = [
  '''your_groq_api_key_here''',
  '''insert_strong_random_secret_here'''
]
