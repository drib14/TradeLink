name: Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (including Git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repository secret scanner
        run: node scripts/check-secrets.js --all

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit Server Dependencies
        run: npm audit --audit-level=high
        working-directory: server
      - name: Audit Student Client Dependencies
        run: npm audit --audit-level=high
        working-directory: client
      - name: Audit Admin Dependencies
        run: npm audit --audit-level=high
        working-directory: admin
      - name: Audit Mobile Dependencies
        run: npm audit --audit-level=high
        working-directory: mobile/user
